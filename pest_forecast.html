<script>
/* ==========================================================================
   JST（Asia/Tokyo）統一ユーティリティ
   ========================================================================== */
const PHOTEOSYNC_TIMEZONE = "Asia/Tokyo";

function getJSTParts(baseDate = new Date()) {
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: PHOTEOSYNC_TIMEZONE, year: "numeric", month: "2-digit", day: "2-digit"
  }).formatToParts(baseDate);
  const out = {};
  for (const part of parts) out[part.type] = part.value;
  return { year: Number(out.year), month: Number(out.month), day: Number(out.day) };
}

function getJSTDateString(baseDate = new Date(), offsetDays = 0) {
  const p = getJSTParts(baseDate);
  const d = new Date(Date.UTC(p.year, p.month - 1, p.day + offsetDays));
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}-${String(d.getUTCDate()).padStart(2, "0")}`;
}

function addJSTDays(dateStr, offsetDays) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr);
  if (!m) return dateStr;
  const d = new Date(Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3]) + offsetDays));
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}-${String(d.getUTCDate()).padStart(2, "0")}`;
}

function isoToJapanese(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  const date = new Date(Date.UTC(y, m - 1, d));
  const weekdays = ["日", "月", "火", "水", "木", "金", "土"];
  return `${y}年${m}月${d}日(${weekdays[date.getUTCDay()]})`;
}

/* ==========================================================================
   Open-Meteo 共通フェッチ処理（PhoteoSync本体と同等のリトライ・タイムアウト付き）
   ========================================================================== */
const OPEN_METEO_ARCHIVE_URL = "https://archive-api.open-meteo.com/v1/archive";

function replaceUrlParam(url, key, value) {
  try {
    const u = new URL(url);
    u.searchParams.set(key, value);
    return u.toString();
  } catch (e) { return url; }
}

function extractArchiveAllowedEndDate(message) {
  const m = /end_date'? is out of allowed range from [\d-]+ to (\d{4}-\d{2}-\d{2})/i.exec(message || "");
  return m ? m[1] : null;
}

async function fetchOpenMeteoJSONOnce(url, timeoutMs) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const res = await fetch(url, { signal: controller.signal });
    clearTimeout(timer);
    if (!res.ok) {
      let reason = "";
      try {
        const body = await res.json();
        reason = body && body.reason ? body.reason : "";
      } catch (e) { /* JSONでなければ無視 */ }
      const err = new Error(`Open-Meteo APIエラー (HTTP ${res.status})${reason ? `：${reason}` : ""}`);
      err.status = res.status; err.reason = reason;
      throw err;
    }
    return await res.json();
  } catch (err) {
    clearTimeout(timer);
    if (err.name === "AbortError") {
      const e2 = new Error(`Open-Meteoへの通信がタイムアウトしました（${Math.round(timeoutMs / 1000)}秒経過）。電波状況をご確認のうえ、もう一度お試しください。`);
      e2.isTimeout = true;
      throw e2;
    }
    throw err;
  }
}

async function fetchOpenMeteoJSON(url, { timeoutMs = 15000, retries = 1 } = {}) {
  let lastErr;
  for (let attempt = 0; attempt <= retries; attempt++) {
    try {
      return await fetchOpenMeteoJSONOnce(url, timeoutMs);
    } catch (err) {
      lastErr = err;
      if (err.status === 400) {
        const allowedEndDate = extractArchiveAllowedEndDate(err.reason || err.message);
        if (allowedEndDate) {
          const adjustedUrl = replaceUrlParam(url, "end_date", allowedEndDate);
          if (adjustedUrl !== url) {
            try { return await fetchOpenMeteoJSONOnce(adjustedUrl, timeoutMs); }
            catch (err2) { lastErr = err2; }
          }
        }
        break;
      }
      if (attempt < retries) { await new Promise(r => setTimeout(r, 1200)); continue; }
    }
  }
  throw lastErr;
}

/* ==========================================================================
   CSV / PNG ダウンロード共通処理
   ========================================================================== */
function downloadCSV(rows, filenamePrefix, startDate, endDate) {
  const csv = "\uFEFF" + rows.map(r => r.join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const filename = endDate && endDate !== startDate
    ? `${filenamePrefix}_${startDate}_${endDate}.csv`
    : `${filenamePrefix}_${startDate}.csv`;
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportCanvasAsPngWithWatermark(sourceCanvas, filename) {
  const width = sourceCanvas.width, height = sourceCanvas.height;
  const outCanvas = document.createElement("canvas");
  outCanvas.width = width; outCanvas.height = height;
  const ctx = outCanvas.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, width, height);
  ctx.drawImage(sourceCanvas, 0, 0, width, height);

  const scale = window.devicePixelRatio || 1;
  const fontSize = Math.round(11 * scale);
  const marginX = Math.round(10 * scale);
  const marginY = Math.round(8 * scale);

  const locationLabel = currentPlaceName
    ? currentPlaceName
    : (lat && lon ? `${lat}, ${lon}` : null);
  if (locationLabel) {
    ctx.font = `${fontSize}px sans-serif`;
    ctx.fillStyle = "rgba(90, 90, 90, 0.65)";
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.fillText(locationLabel, marginX, marginY);
  }
  ctx.font = `${fontSize}px sans-serif`;
  ctx.fillStyle = "rgba(90, 90, 90, 0.65)";
  ctx.textAlign = "right"; ctx.textBaseline = "bottom";
  ctx.fillText(`© ${new Date().getFullYear()} PhoteoSync`, width - marginX, height - marginY);

  const url = outCanvas.toDataURL("image/png", 1.0);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

/* ==========================================================================
   位置情報（現在地取得 + 国土地理院(GSI)による逆ジオコーディングで
   市区町村名・大字名まで取得。取得できない場合は座標のみ表示） or 手動入力
   ========================================================================== */
let lat = null;
let lon = null;
let currentPlaceName = null; // 逆ジオコーディングで取得できた地名（取得できない場合はnullのまま）

/* ▼ 国土地理院(GSI) 市区町村変換テーブル(muni.js)の読み込み
      muniCd と lv01Nm(大字等)は同じGSIレコードから得られるため、
      市区町村と大字が食い違うことがない */
function loadMuniTable() {
  return new Promise((resolve, reject) => {
    if (window.GSI && window.GSI.MUNI_ARRAY) {
      resolve();
      return;
    }
    window.GSI = window.GSI || {};
    const script = document.createElement("script");
    script.src = "https://maps.gsi.go.jp/js/muni.js";
    script.onload = () => resolve();
    script.onerror = () => reject(new Error("muni.js load failed"));
    document.head.appendChild(script);
  });
}

/* ▼ 緯度・経度から市区町村名・大字名を逆ジオコーディングする */
function reverseGeocode(latVal, lonVal) {
  return Promise.all([
    loadMuniTable(),
    fetch(`https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress?lat=${latVal}&lon=${lonVal}`)
      .then(res => res.json())
  ])
    .then(([, geo]) => {
      const results = geo && geo.results;
      if (!results || !results.muniCd) {
        throw new Error("住所情報が見つかりませんでした");
      }
      const muniKey = String(Number(results.muniCd));
      const muniRow = window.GSI.MUNI_ARRAY ? window.GSI.MUNI_ARRAY[muniKey] : null;
      const muniName = muniRow ? muniRow.split(",")[3] : "";
      const oaza = results.lv01Nm || "";
      const placeName = `${muniName}${oaza}`;
      currentPlaceName = placeName || null;
      document.getElementById("location-display").textContent =
        `${latVal}, ${lonVal}${placeName ? "　" + placeName : ""}`;
    })
    .catch(() => {
      // GSIでデータが見つからない地域(離島・一部山間部等)は座標のみ表示
      currentPlaceName = null;
      document.getElementById("location-display").textContent = `${latVal}, ${lonVal}`;
    });
}

function requestLocation() {
  if (!navigator.geolocation) {
    document.getElementById("location-display").textContent = "このブラウザは位置情報取得に対応していません。手動で入力してください。";
    return;
  }
  document.getElementById("location-display").textContent = "取得中…";
  navigator.geolocation.getCurrentPosition(
    pos => {
      lat = pos.coords.latitude.toFixed(6);
      lon = pos.coords.longitude.toFixed(6);
      document.getElementById("location-display").textContent = `${lat}, ${lon}（地名取得中…）`;
      reverseGeocode(lat, lon);
    },
    () => {
      document.getElementById("location-display").textContent = "取得できませんでした（手動入力をご利用ください）";
    }
  );
}

function applyManualLocation() {
  const la = Number(document.getElementById("manual-lat").value);
  const lo = Number(document.getElementById("manual-lon").value);
  if (!Number.isFinite(la) || !Number.isFinite(lo)) {
    alert("緯度・経度を数値で入力してください。");
    return;
  }
  lat = la.toFixed(6); lon = lo.toFixed(6);
  document.getElementById("location-display").textContent = `${lat}, ${lon}（手動入力・地名取得中…）`;
  reverseGeocode(lat, lon);
}

window.addEventListener("load", requestLocation);

const MATCH_RULES = [
  ["オオタバコガ", "tabakoga"],
  ["コナジラミ", "whitefly"],
  ["アザミウマ", "thrips"],
  ["ハスモンヨトウ", "armyworm"],
  ["ヨトウムシ", "armyworm"],
  ["コナガ", "diamondback"],
  ["ハダニ", "mite"],
  ["カメムシ", "stinkbug"],
  ["アブラムシ", "aphid"],
  ["いもち病", "blast"],
  ["うどんこ病", "powdery"],
  ["灰色かび病", "graymold"],
  ["べと病", "downy"],
  ["疫病", "blight"]
];

function matchModelForName(name) {
  for (const [keyword, modelId] of MATCH_RULES) {
    if (name.includes(keyword)) return modelId;
  }
  return null;
}

/* ▼ 病害モデルの湿度条件を説明文にする */
function formatRhCondition(model) {
  if (Number.isFinite(model.rhMin)) return `日平均相対湿度${model.rhMin}%以上（多湿）`;
  if (Number.isFinite(model.rhMax)) return `日平均相対湿度${model.rhMax}%以下（乾燥気味）`;
  return "湿度条件なし";
}

/* ▼ 作物プルダウンの初期化 */
function populateCropSelect() {
  const sel = document.getElementById("crop-select");
  CROP_DATA.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c.id;
    opt.textContent = `${c.name_ja}（${c.category}）`;
    sel.appendChild(opt);
  });
  onCropChange();
}

/* ▼ 作物選択に応じて、対象の病害虫プルダウンを更新する
      （crops_InsectPests.json の main_pests / main_diseases をそのまま列挙し、
        末尾にカスタム入力欄を追加する） */
function onCropChange() {
  const cropId = document.getElementById("crop-select").value;
  const crop = CROP_DATA.find(c => c.id === cropId);
  const sel = document.getElementById("target-select");
  sel.innerHTML = "";

  crop.main_pests.forEach(name => {
    const opt = document.createElement("option");
    opt.value = "pest::" + name;
    opt.textContent = "🐛 " + name;
    sel.appendChild(opt);
  });
  crop.main_diseases.forEach(name => {
    const opt = document.createElement("option");
    opt.value = "disease::" + name;
    opt.textContent = "🦠 " + name;
    sel.appendChild(opt);
  });
  const customOpt = document.createElement("option");
  customOpt.value = "custom::カスタム入力";
  customOpt.textContent = "🔧 カスタム（発育零点・有効積算温度を入力）";
  sel.appendChild(customOpt);

  onTargetChange();
}

/* ▼ 病害虫選択に応じて、モデル情報表示とカスタム入力欄の表示を更新する */
function onTargetChange() {
  const val = document.getElementById("target-select").value;
  const sep = val.indexOf("::");
  const kind = val.slice(0, sep);
  const rawName = val.slice(sep + 2);

  const infoDiv = document.getElementById("target-model-info");
  const customDiv = document.getElementById("custom-inputs");

  if (kind === "custom") {
    customDiv.style.display = "block";
    document.getElementById("custom-basetemp").value = 10;
    document.getElementById("custom-dd").value = 200;
    infoDiv.innerHTML = "お手元の都道府県病害虫防除所資料などで公表されている発育零点・有効積算温度の値を、下欄に入力してご利用ください。";
    return;
  }

  const modelId = matchModelForName(rawName);
  if (!modelId) {
    customDiv.style.display = "block";
    document.getElementById("custom-basetemp").value = "";
    document.getElementById("custom-dd").value = "";
    infoDiv.innerHTML =
      `<b>${rawName}</b> に対応する発育零点・有効積算温度、または発生気象条件のデータは、現時点で当ツールには登録されていません。<br>` +
      `お手元の都道府県病害虫防除所資料などに発育零点・有効積算温度の記載があれば、下欄に入力することで積算計算をご利用いただけます` +
      `（気象条件による病害モデルのカスタム入力には対応していません）。`;
    return;
  }

  const model = MODEL_LIBRARY[modelId];
  customDiv.style.display = "none";
  let html = `<b>${rawName}</b>　→　参照モデル：${model.name}<br>`;
  if (model.type === "insect") {
    html += `発育零点：${model.baseTemp}℃　有効積算温度：${model.dd}日度／世代<br>`;
  } else if (model.type === "disease") {
    html += `発生しやすい目安条件：日平均気温 ${model.tempMin}〜${model.tempMax}℃　かつ　${formatRhCondition(model)}${model.radDeficit ? `　かつ　直近${model.radDeficit.window}日間平均の日射量が平年比${Math.round(model.radDeficit.ratioThreshold * 100)}%未満（日照不足）` : ""}<br>`;
  } else if (model.type === "blast") {
    html += `感染好適条件（簡易判定）：日平均気温15〜25℃　かつ　日降水量1mm以上　かつ　直近5日間平均気温20〜25℃<br>`;
  }
  html += `<span style="color:#777;">${model.note}<br>出典：${model.source}</span>`;
  infoDiv.innerHTML = html;
}

/* ▼ 現在選択中の対象について、実行に使うモデル（種別・パラメータ・出典等）を確定する */
function getActiveModel() {
  const val = document.getElementById("target-select").value;
  const sep = val.indexOf("::");
  const kind = val.slice(0, sep);
  const rawName = val.slice(sep + 2);

  if (kind === "custom") {
    const baseTemp = Number(document.getElementById("custom-basetemp").value);
    const dd = Number(document.getElementById("custom-dd").value);
    if (!Number.isFinite(baseTemp) || !Number.isFinite(dd) || dd <= 0) {
      throw new Error("カスタムの発育零点・有効積算温度には数値を入力してください。");
    }
    return {
      displayName: "カスタム入力の対象害虫",
      type: "insect", baseTemp, dd,
      note: "利用者が入力したカスタム値です。", source: "利用者入力値"
    };
  }

  const modelId = matchModelForName(rawName);
  if (!modelId) {
    const baseTemp = Number(document.getElementById("custom-basetemp").value);
    const dd = Number(document.getElementById("custom-dd").value);
    if (Number.isFinite(baseTemp) && Number.isFinite(dd) && dd > 0) {
      return {
        displayName: rawName,
        type: "insect", baseTemp, dd,
        note: "モデル未登録のため、利用者が入力した発育零点・有効積算温度を使用しています。",
        source: "利用者入力値"
      };
    }
    throw new Error(`「${rawName}」に対応するデータが登録されていません。カスタム欄に発育零点・有効積算温度を入力してください。`);
  }

  return Object.assign({ displayName: rawName }, MODEL_LIBRARY[modelId]);
}

async function runForecast() {
  const cropId = document.getElementById("crop-select").value;
  const crop = CROP_DATA.find(c => c.id === cropId);
  const startDate = document.getElementById("pest-start-date").value;
  const endDate = getJSTDateString(new Date(), 90);

  if (!lat || !lon) { alert("現在地が取得できていません。位置情報を許可するか、緯度・経度を手動で入力してください。"); return; }
  if (!startDate) { alert("起算日／集計開始日を選択してください。"); return; }
  if (startDate > endDate) { alert("開始日は集計終了日（本日+90日）より前の日付を指定してください。"); return; }

  const info = document.getElementById("pest-info");
  info.style.display = "block";
  info.innerHTML = '<div class="loading-box">📥 気象データを取得し、発生予察を計算しています…</div>';
  document.getElementById("pest-chart-toolbar").style.display = "none";
  document.getElementById("pest-chart-wrapper").style.display = "none";
  document.getElementById("pest-refs").style.display = "none";

  try {
    const model = getActiveModel();
    const { series, dates } = await fetchPestWeatherSeries(startDate, endDate, !!model.radDeficit);

    if (model.type === "insect") {
      renderInsectChart(crop.name_ja, model, series, dates, startDate, endDate);
    } else if (model.type === "disease") {
      renderDiseaseChart(crop.name_ja, model, series, dates, startDate, endDate);
    } else if (model.type === "blast") {
      renderBlastChart(crop.name_ja, model, series, dates, startDate, endDate);
    }
  } catch (err) {
    console.error(err);
    info.innerHTML = `<div class="loading-box"><b>発生予察の計算に失敗しました。</b><br>${err.message || err}</div>`;
  }
}

/* ▼ 開始日〜終了日の日別気象データ（気温平均・降水量・湿度・日射量）を取得する。
      本日−92日より前の過去日は archive-api の実測値、直近92日〜+16日は forecast-api、
      本日+16日より先の未来日は過去5年の同日平均値で補完する。
      needClimatology が true の場合は、実測でカバーできる日についても
      「その日の平年値（過去5年の同日平均）」を別途あわせて取得し、
      日照不足の判定などに使えるようにする。 */
async function fetchPestWeatherSeries(startDate, endDate, needClimatology) {
  const today = getJSTDateString();
  const forecastPastLimit = addJSTDays(today, -92);
  const DAILY_VARS = "temperature_2m_mean,precipitation_sum,relative_humidity_2m_mean,shortwave_radiation_sum";

  const forecastUrl =
    `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
    `&daily=${DAILY_VARS}` +
    `&past_days=92&forecast_days=16&timezone=${PHOTEOSYNC_TIMEZONE}`;
  const forecastData = await fetchOpenMeteoJSON(forecastUrl);

  const actualByDate = {};
  if (forecastData.daily && forecastData.daily.time) {
    for (let i = 0; i < forecastData.daily.time.length; i++) {
      actualByDate[forecastData.daily.time[i]] = {
        mean: forecastData.daily.temperature_2m_mean[i],
        rain: forecastData.daily.precipitation_sum[i],
        rh: forecastData.daily.relative_humidity_2m_mean ? forecastData.daily.relative_humidity_2m_mean[i] : null,
        sw: forecastData.daily.shortwave_radiation_sum ? forecastData.daily.shortwave_radiation_sum[i] : null
      };
    }
  }

  if (startDate < forecastPastLimit) {
    const archiveEnd = addJSTDays(forecastPastLimit, -1);
    if (startDate <= archiveEnd) {
      const archiveUrl =
        `${OPEN_METEO_ARCHIVE_URL}?latitude=${lat}&longitude=${lon}` +
        `&start_date=${startDate}&end_date=${archiveEnd}` +
        `&daily=${DAILY_VARS}&timezone=${PHOTEOSYNC_TIMEZONE}`;
      const archData = await fetchOpenMeteoJSON(archiveUrl);
      if (archData.daily && archData.daily.time) {
        for (let i = 0; i < archData.daily.time.length; i++) {
          if (!actualByDate[archData.daily.time[i]]) {
            actualByDate[archData.daily.time[i]] = {
              mean: archData.daily.temperature_2m_mean[i],
              rain: archData.daily.precipitation_sum[i],
              rh: archData.daily.relative_humidity_2m_mean ? archData.daily.relative_humidity_2m_mean[i] : null,
              sw: archData.daily.shortwave_radiation_sum ? archData.daily.shortwave_radiation_sum[i] : null
            };
          }
        }
      }
    }
  }

  const allDates = [];
  for (let d = startDate; d <= endDate; d = addJSTDays(d, 1)) allDates.push(d);

  const needsFallback = allDates.some(d => {
    const a = actualByDate[d];
    return !a || !Number.isFinite(a.mean);
  });

  /* ▼ 5年平均値（気候値）テーブル。未来日の補完だけでなく、
        needClimatology=true の場合は「日照不足」等の平年比判定にも使う。 */
  let avgByMonthDay = {};
  if (needsFallback || needClimatology) {
    const [ey] = today.split("-").map(Number);
    const archStart = `${ey - 5}-01-01`;
    const archiveUrl =
      `${OPEN_METEO_ARCHIVE_URL}?latitude=${lat}&longitude=${lon}` +
      `&start_date=${archStart}&end_date=${today}` +
      `&daily=${DAILY_VARS}&timezone=${PHOTEOSYNC_TIMEZONE}`;
    const archData = await fetchOpenMeteoJSON(archiveUrl);
    if (archData.daily && archData.daily.time) {
      const sums = {};
      for (let i = 0; i < archData.daily.time.length; i++) {
        const md = archData.daily.time[i].slice(5);
        if (!sums[md]) sums[md] = { meanSum: 0, meanCount: 0, rainSum: 0, rainCount: 0, rhSum: 0, rhCount: 0, swSum: 0, swCount: 0 };
        const mv = archData.daily.temperature_2m_mean[i], rv = archData.daily.precipitation_sum[i];
        const hv = archData.daily.relative_humidity_2m_mean ? archData.daily.relative_humidity_2m_mean[i] : null;
        const sv = archData.daily.shortwave_radiation_sum ? archData.daily.shortwave_radiation_sum[i] : null;
        if (Number.isFinite(mv)) { sums[md].meanSum += mv; sums[md].meanCount++; }
        if (Number.isFinite(rv)) { sums[md].rainSum += rv; sums[md].rainCount++; }
        if (Number.isFinite(hv)) { sums[md].rhSum += hv; sums[md].rhCount++; }
        if (Number.isFinite(sv)) { sums[md].swSum += sv; sums[md].swCount++; }
      }
      for (const md in sums) {
        const s = sums[md];
        avgByMonthDay[md] = {
          mean: s.meanCount ? s.meanSum / s.meanCount : null,
          rain: s.rainCount ? s.rainSum / s.rainCount : null,
          rh: s.rhCount ? s.rhSum / s.rhCount : null,
          sw: s.swCount ? s.swSum / s.swCount : null
        };
      }
    }
  }

  const series = {};
  allDates.forEach(dateStr => {
    const a = actualByDate[dateStr];
    const useActual = a && Number.isFinite(a.mean);
    const md = dateStr.slice(5);
    const climatology = avgByMonthDay[md] || {};
    if (useActual) {
      series[dateStr] = {
        mean: a.mean,
        rain: Number.isFinite(a.rain) ? a.rain : 0,
        rh: Number.isFinite(a.rh) ? a.rh : null,
        sw: Number.isFinite(a.sw) ? a.sw : null,
        swAvg: Number.isFinite(climatology.sw) ? climatology.sw : null,
        estimated: false
      };
    } else {
      series[dateStr] = {
        mean: Number.isFinite(climatology.mean) ? climatology.mean : 0,
        rain: Number.isFinite(climatology.rain) ? climatology.rain : 0,
        rh: Number.isFinite(climatology.rh) ? climatology.rh : null,
        sw: Number.isFinite(climatology.sw) ? climatology.sw : null,
        swAvg: Number.isFinite(climatology.sw) ? climatology.sw : null,
        estimated: true
      };
    }
  });

  return { series, dates: allDates };
}

/* ▼ 昆虫（積算温度モデル）の発生予察グラフを描画する */
function renderInsectChart(cropName, model, series, dates, startDate, endDate) {
  let cum = 0;
  const cumArr = [];
  const gens = [];
  let nextGenIndex = 1;
  dates.forEach(d => {
    const eff = Math.max(0, series[d].mean - model.baseTemp);
    cum += eff;
    cumArr.push(cum);
    while (cum >= model.dd * nextGenIndex) {
      gens.push({ gen: nextGenIndex, date: d });
      nextGenIndex++;
    }
  });

  const maxGenShown = Math.min(Math.max(nextGenIndex, 1), 6);
  const dispLabels = dates.map(d => `${d.slice(5, 7)}/${d.slice(8, 10)}`);
  const genColors = ["#e53935", "#fb8c00", "#8e24aa", "#3949ab", "#00897b", "#6d4c41"];

  const datasets = [
    { label: "積算有効温度（日度）", data: cumArr, borderColor: "#2e7d32", backgroundColor: "transparent", pointRadius: 0, borderWidth: 2 }
  ];
  for (let g = 1; g <= maxGenShown; g++) {
    datasets.push({
      label: `第${g}世代 閾値（${(model.dd * g).toFixed(0)}日度）`,
      data: dates.map(() => model.dd * g),
      borderColor: genColors[(g - 1) % genColors.length],
      borderDash: [6, 4], borderWidth: 1, pointRadius: 0, backgroundColor: "transparent"
    });
  }

  document.getElementById("pest-chart-wrapper").style.display = "block";
  document.getElementById("pest-chart-toolbar").style.display = "flex";
  const chartInner = document.getElementById("pest-chart-inner");
  const chartWrapper = chartInner.parentElement;
  chartInner.style.width = Math.max(chartWrapper.clientWidth, dates.length * 6) + "px";

  if (pestChartInstance) pestChartInstance.destroy();
  pestChartInstance = new Chart(document.getElementById("pest-chart"), {
    type: "line",
    data: { labels: dispLabels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        title: { display: true, text: `${cropName}：${model.displayName}　積算有効温度（起算日: ${startDate}）${locationTitleSuffix()}`, font: { size: 15 }, padding: { top: 4, bottom: 12 } },
        tooltip: { mode: "index", intersect: false }
      },
      hover: { mode: "index", intersect: false },
      scales: {
        y: { type: "linear", position: "left", title: { display: true, text: "積算有効温度（日度）" } },
        x: { title: { display: true, text: "日付" } }
      }
    }
  });

  pestResultData = { type: "insect", cropName, model, dates, series, startDate, endDate };

  const info = document.getElementById("pest-info");
  info.style.display = "block";
  const genText = gens.length
    ? gens.map(g => `第${g.gen}世代 到達目安：${isoToJapanese(g.date)}`).join("<br>")
    : "選択期間内には閾値に到達しませんでした。";
  info.innerHTML = `📅 起算日：${startDate}　集計終了日：${endDate}（本日+90日）<br>発育零点：${model.baseTemp}℃　有効積算温度：${model.dd}日度／世代<br><br>${genText}<br><span style="font-size:.75rem;color:#777;">※ 実測・予報データが無い期間は、過去5年の同日平均値で補完しています。発生時期はあくまで目安です。</span>`;

  renderRefs(model);
}

/* ▼ 病害（気象条件モデル）の発生好適日グラフを描画する */
/* ▼ 病害モデルの湿度条件（rhMin/rhMax）を、その日の実測・推定湿度で判定する。
      湿度データが取得できなかった日は、降水量の有無を代用する（フォールバック）。 */
function evaluateRhCondition(model, v) {
  if (Number.isFinite(v.rh)) {
    if (Number.isFinite(model.rhMin)) return v.rh >= model.rhMin;
    if (Number.isFinite(model.rhMax)) return v.rh <= model.rhMax;
    return true;
  }
  if (Number.isFinite(model.rhMin)) return v.rain >= 1;
  if (Number.isFinite(model.rhMax)) return v.rain < 1;
  return true;
}

/* ▼ 「日照不足が続いているか」を、直近N日間平均の日射量が平年値（過去5年の同日平均）に
      対してどの程度の割合かで判定する。平年値・実測値のどちらかが欠けている日は
      判定材料が無いため、その日はカウントせず（＝日照不足の判定には使わない）。
      比較対象の日数が1日も無い場合は判定不能として true（条件を妨げない）を返す。 */
function evaluateRadiationDeficit(model, series, dates, i) {
  if (!model.radDeficit) return true;
  const { window, ratioThreshold } = model.radDeficit;
  const startIdx = Math.max(0, i - window + 1);
  let ratioSum = 0, count = 0;
  for (let k = startIdx; k <= i; k++) {
    const v = series[dates[k]];
    if (Number.isFinite(v.sw) && Number.isFinite(v.swAvg) && v.swAvg > 0) {
      ratioSum += v.sw / v.swAvg;
      count++;
    }
  }
  if (count === 0) return true;
  return (ratioSum / count) < ratioThreshold;
}

/* ▼ 日照不足判定に使っている「直近N日平均の日射量平年比(%)」を、
      グラフ表示用に日付ごとの系列として計算する（radDeficitが無いモデルではnull） */
function computeRadiationRatioSeries(model, series, dates) {
  if (!model.radDeficit) return null;
  const { window } = model.radDeficit;
  return dates.map((d, i) => {
    const startIdx = Math.max(0, i - window + 1);
    let sum = 0, count = 0;
    for (let k = startIdx; k <= i; k++) {
      const v = series[dates[k]];
      if (Number.isFinite(v.sw) && Number.isFinite(v.swAvg) && v.swAvg > 0) {
        sum += v.sw / v.swAvg;
        count++;
      }
    }
    return count > 0 ? (sum / count) * 100 : null;
  });
}

function renderDiseaseChart(cropName, model, series, dates, startDate, endDate) {
  const flags = [];
  const temps = [];
  const riskDates = [];
  let rhMissingCount = 0;
  dates.forEach((d, i) => {
    const v = series[d];
    temps.push(v.mean);
    if (!Number.isFinite(v.rh)) rhMissingCount++;
    const tempOK = v.mean >= model.tempMin && v.mean <= model.tempMax;
    const rhOK = evaluateRhCondition(model, v);
    const radOK = evaluateRadiationDeficit(model, series, dates, i);
    const flag = tempOK && rhOK && radOK;
    flags.push(flag ? 1 : 0);
    if (flag) riskDates.push(d);
  });

  const humidity = dates.map(d => Number.isFinite(series[d].rh) ? series[d].rh : null);
  const radiationRatio = computeRadiationRatioSeries(model, series, dates);
  const radThresholdPercent = model.radDeficit ? model.radDeficit.ratioThreshold * 100 : null;
  renderRiskChart(cropName, `${model.displayName}　発生条件チェック`, "発生好適日", flags, temps, dates, startDate, endDate, humidity, radiationRatio, radThresholdPercent);

  pestResultData = { type: "disease", cropName, model, dates, series, flags, startDate, endDate };

  const info = document.getElementById("pest-info");
  info.style.display = "block";
  const listHtml = riskDates.length
    ? riskDates.slice(0, 15).map(isoToJapanese).join("、") + (riskDates.length > 15 ? ` ほか${riskDates.length - 15}日` : "")
    : "該当日はありませんでした。";
  const rhNote = rhMissingCount > 0
    ? `<br>※ 湿度データが取得できなかった${rhMissingCount}日は、降水量の有無で代用して判定しています。`
    : "";
  const radConditionText = model.radDeficit
    ? "（判定条件：気温 + 湿度 + 日照不足）"
    : "（判定条件：気温 + 湿度）";
  info.innerHTML = `📅 集計期間：${startDate}〜${endDate}<br>発生好適日数：${riskDates.length}日／${dates.length}日${radConditionText}<br>該当日：${listHtml}<br><span style="font-size:.75rem;color:#777;">※ 実測・予報データが無い期間は、過去5年の同日平均値で補完しています。簡易的な気象条件による目安であり、実際の発生を保証するものではありません。${rhNote}</span>`;

  renderRefs(model);
}

/* ▼ いもち病（葉いもち・簡易BLASTAM）の感染好適日グラフを描画する */
function renderBlastChart(cropName, model, series, dates, startDate, endDate) {
  const means = dates.map(d => series[d].mean);
  const flags = [];
  const riskDates = [];
  let rhMissingCount = 0;
  dates.forEach((d, i) => {
    const v = series[d];
    if (!Number.isFinite(v.rh)) rhMissingCount++;
    const windowVals = means.slice(Math.max(0, i - 4), i + 1);
    const avg5 = windowVals.reduce((a, b) => a + b, 0) / windowVals.length;
    const wetOK = Number.isFinite(v.rh) ? v.rh >= 90 : v.rain >= 1;
    const dayTempOK = v.mean >= 15 && v.mean <= 25;
    const avg5OK = avg5 >= 20 && avg5 <= 25;
    const flag = wetOK && dayTempOK && avg5OK;
    flags.push(flag ? 1 : 0);
    if (flag) riskDates.push(d);
  });

  const humidity = dates.map(d => Number.isFinite(series[d].rh) ? series[d].rh : null);
  renderRiskChart(cropName, `${model.displayName}　感染好適日チェック（簡易判定）`, "感染好適日", flags, means, dates, startDate, endDate, humidity);

  pestResultData = { type: "blast", cropName, model, dates, series, flags, startDate, endDate };

  const info = document.getElementById("pest-info");
  info.style.display = "block";
  const listHtml = riskDates.length
    ? riskDates.slice(0, 15).map(isoToJapanese).join("、") + (riskDates.length > 15 ? ` ほか${riskDates.length - 15}日` : "")
    : "該当日はありませんでした。";
  const rhNote = rhMissingCount > 0
    ? `<br>※ 湿度データが取得できなかった${rhMissingCount}日は、降水量の有無で代用して判定しています。`
    : "";
  info.innerHTML = `📅 集計期間：${startDate}〜${endDate}<br>感染好適日数（簡易判定）：${riskDates.length}日／${dates.length}日<br>好適条件が広域・連続して現れた場合、通常その1〜2週間後に葉いもちの発生が確認されやすいとされています。<br>該当日：${listHtml}<br><span style="font-size:.75rem;color:#777;">※ 日平均相対湿度90%以上を「葉の濡れ」の代用としており、正式なBLASTAM判定（葉面湿潤時間の実測）とは異なる簡易指標です。必ずお住まいの都道府県病害虫防除所の発生予察情報もご確認ください。${rhNote}</span>`;

  renderRefs(model);
}

/* ▼ 病害系（disease/blast）共通：好適日フラグ＋気温＋湿度（＋日照比率）の複合グラフを描画する */
function renderRiskChart(cropName, titleSuffix, flagLabel, flags, temps, dates, startDate, endDate, humidity, radiationRatio, radThresholdPercent) {
  const dispLabels = dates.map(d => `${d.slice(5, 7)}/${d.slice(8, 10)}`);

  document.getElementById("pest-chart-wrapper").style.display = "block";
  document.getElementById("pest-chart-toolbar").style.display = "flex";
  const chartInner = document.getElementById("pest-chart-inner");
  const chartWrapper = chartInner.parentElement;
  chartInner.style.width = Math.max(chartWrapper.clientWidth, dates.length * 6) + "px";

  const datasets = [
    { type: "bar", label: flagLabel, data: flags, backgroundColor: "rgba(229,57,53,0.6)", yAxisID: "y1" },
    { type: "line", label: "日平均気温 (℃)", data: temps, borderColor: "green", backgroundColor: "transparent", pointRadius: 0, borderWidth: 2, yAxisID: "y" }
  ];
  if (humidity) {
    datasets.push({ type: "line", label: "日平均相対湿度 (%)", data: humidity, borderColor: "#1565c0", backgroundColor: "transparent", pointRadius: 0, borderWidth: 2, borderDash: [4, 3], yAxisID: "y2" });
  }
  if (radiationRatio) {
    datasets.push({ type: "line", label: "日射量 平年比（直近3日平均, %）", data: radiationRatio, borderColor: "#f9a825", backgroundColor: "transparent", pointRadius: 0, borderWidth: 2, yAxisID: "y3", spanGaps: true });
    if (Number.isFinite(radThresholdPercent)) {
      datasets.push({ type: "line", label: `日照不足の目安（平年比${radThresholdPercent}%）`, data: dates.map(() => radThresholdPercent), borderColor: "#bdbdbd", borderDash: [3, 3], borderWidth: 1, pointRadius: 0, backgroundColor: "transparent", yAxisID: "y3" });
    }
  }

  if (pestChartInstance) pestChartInstance.destroy();
  pestChartInstance = new Chart(document.getElementById("pest-chart"), {
    data: { labels: dispLabels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        title: { display: true, text: `${cropName}：${titleSuffix}（${startDate}〜${endDate}）${locationTitleSuffix()}`, font: { size: 15 }, padding: { top: 4, bottom: 12 } },
        tooltip: { mode: "index", intersect: false }
      },
      hover: { mode: "index", intersect: false },
      scales: {
        y: { type: "linear", position: "left", title: { display: true, text: "日平均気温 (℃)" } },
        y2: { type: "linear", position: "left", min: 0, max: 100, title: { display: true, text: "相対湿度 (%)" }, grid: { drawOnChartArea: false }, display: !!humidity },
        y3: { type: "linear", position: "right", min: 0, max: 150, title: { display: true, text: "日射量 平年比 (%)" }, grid: { drawOnChartArea: false }, display: !!radiationRatio },
        y1: { type: "linear", position: "right", min: 0, max: 1, ticks: { stepSize: 1, callback: v => v === 1 ? "該当" : "—" }, title: { display: true, text: flagLabel }, grid: { drawOnChartArea: false } },
        x: { title: { display: true, text: "日付" } }
      }
    }
  });
}

/* ▼ 出典・参考情報の表示 */
function renderRefs(model) {
  const refs = document.getElementById("pest-refs");
  refs.style.display = "block";
  refs.innerHTML = `<b>出典・参考：</b>${model.source}<br>${model.note}<br>実際の防除の判断は、必ずお住まいの都道府県病害虫防除所が発表する「病害虫発生予察情報」もあわせてご確認ください。`;
}

/* ▼ 病害虫予察データをCSVとしてダウンロード */
function exportPestCSV() {
  if (!pestResultData) { alert("先に発生予察を実行してください。"); return; }
  const { type, cropName, model, dates, series, startDate, endDate } = pestResultData;
  let rows;
  if (type === "insect") {
    rows = [["日付", "日平均気温(℃)", "有効温度(日度)", "積算有効温度(日度)", "備考"]];
    let cum = 0;
    dates.forEach(d => {
      const eff = Math.max(0, series[d].mean - model.baseTemp);
      cum += eff;
      rows.push([d, series[d].mean.toFixed(1), eff.toFixed(2), cum.toFixed(2), series[d].estimated ? "過去5年平均で補完" : "実測/予報"]);
    });
  } else {
    const hasRad = !!model.radDeficit;
    const headers = ["日付", "日平均気温(℃)", "日平均相対湿度(%)", "日降水量(mm)"];
    if (hasRad) headers.push("日射量(MJ/m2)", "日射量 平年比(%)");
    headers.push("該当有無", "備考");
    rows = [headers];
    dates.forEach((d, i) => {
      const v = series[d];
      const rhText = Number.isFinite(v.rh) ? v.rh.toFixed(0) : "";
      const row = [d, v.mean.toFixed(1), rhText, v.rain.toFixed(1)];
      if (hasRad) {
        const swText = Number.isFinite(v.sw) ? v.sw.toFixed(1) : "";
        const ratioText = (Number.isFinite(v.sw) && Number.isFinite(v.swAvg) && v.swAvg > 0) ? (v.sw / v.swAvg * 100).toFixed(0) : "";
        row.push(swText, ratioText);
      }
      row.push(pestResultData.flags[i] ? "該当" : "", v.estimated ? "過去5年平均で補完" : "実測/予報");
      rows.push(row);
    });
  }
  const prefix = `photeosync_pest_${cropName}_${model.displayName}`.replace(/[\s\/（）()]/g, "_");
  downloadCSV(rows, prefix, startDate, endDate);
}

/* ▼ 病害虫予察グラフをPNG画像としてダウンロード */
function exportPestPNG() {
  if (!pestChartInstance || !pestResultData) { alert("ダウンロードできるグラフがありません。"); return; }
  const { cropName, model, startDate, endDate } = pestResultData;
  const filename = `photeosync_pest_${cropName}_${model.displayName}_${startDate}_${endDate}.png`.replace(/[\s\/（）()]/g, "_");
  exportCanvasAsPngWithWatermark(pestChartInstance.canvas, filename);
}

   ========================================================================== */
(function init() {
  populateCropSelect();
  const endDate = getJSTDateString(new Date(), 90);
  const minDate = getJSTDateString(new Date(), -365);
  const input = document.getElementById("pest-start-date");
  input.value = getJSTDateString(new Date(), -30);
  input.min = minDate;
  input.max = endDate;
})();
</script>
