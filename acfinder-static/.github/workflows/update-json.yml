name: Update acis.json

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  build-json:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 jq wget

      - name: Download latest acis.db
        run: |
          wget https://raw.githubusercontent.com/macs-labo/macs/main/data/acis.db -O acis.db

      - name: Convert acis.db → acis.json
        run: |
          sqlite3 -json acis.db "SELECT * FROM tekiyo;" > acis.json

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add acis.json
          git commit -m "Update acis.json"
          git push
