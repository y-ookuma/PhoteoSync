name: Update JMA history data

on:
  schedule:
    # 03:30 JST every day (18:30 UTC). Avoid the top of the hour.
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jma-history
  cancel-in-progress: true

jobs:
  update-jma:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Fetch JMA historical data
        run: python update_jma_history.py

      - name: Commit JMA JSON
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/svgjma-history.json
          if git diff --cached --quiet; then
            echo 'No JMA data changes.'
          else
            git commit -m 'Update JMA historical weather data'
            git push
          fi

